name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep every push's run; do not cancel older runs when a new push arrives.
jobs:
  verify:
    name: Tests, types, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install locked dependencies
        id: install
        run: |
          mkdir -p verification
          npm ci --include=dev --ignore-scripts 2>&1 | tee verification/install.log
      - name: Install Chromium for PDF QR verification
        id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install --with-deps chromium
      - name: Record exact source and runtime
        if: always()
        run: |
          mkdir -p verification
          {
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Ref: $GITHUB_REF"
            echo "Event SHA: $GITHUB_SHA"
            echo "Checked-out SHA: $(git rev-parse HEAD)"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Attempt: $GITHUB_RUN_ATTEMPT"
            echo "UTC: $(date -u +%FT%TZ)"
            node --version
            npm --version
            sha256sum package-lock.json
          } | tee verification/source.txt
      - name: Full automated tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: npm test 2>&1 | tee verification/tests.log
      - name: Audit locked dependencies
        id: security
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=low 2>&1 | tee verification/security.log
      - name: Type check
        id: types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee verification/types.log
      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint 2>&1 | tee verification/lint.log
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          VITE_AUTH_ENABLED: "false"
        run: |
          npm run build 2>&1 | tee verification/build.log
          node --input-type=module <<'NODE' 2>&1 | tee -a verification/build.log
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const major = readFileSync('.nvmrc', 'utf8').trim();
          const config = JSON.parse(readFileSync('.vercel/output/functions/__server.func/.vc-config.json', 'utf8'));
          assert.equal(config.runtime, `nodejs${major}.x`);
          assert.deepEqual(config.regions, ['pdx1']);
          console.log(`Verified deployed function runtime: ${config.runtime}`);
          NODE
      - name: Publish verification summary
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          SECURITY_RESULT: ${{ steps.security.outcome }}
          TYPE_RESULT: ${{ steps.types.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          mkdir -p verification
          {
            echo '# Eugene Desk verification'
            echo
            echo "Commit: $GITHUB_SHA · attempt $GITHUB_RUN_ATTEMPT"
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Locked install | $INSTALL_RESULT |"
            echo "| Chromium for PDF verification | $BROWSER_RESULT |"
            echo "| Full tests | $TEST_RESULT |"
            echo "| Dependency audit | $SECURITY_RESULT |"
            echo "| Type check | $TYPE_RESULT |"
            echo "| Lint | $LINT_RESULT |"
            echo "| Production build | $BUILD_RESULT |"
            echo
            echo 'Logs and source metadata are attached as a verification artifact (90-day retention, subject to repository policy).'
            echo 'These checks do not include real-device/browser QA and do not gate the independent Vercel deployment.'
          } | tee verification/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve logs, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}-${{ github.run_attempt }}
          path: verification/
          retention-days: 90
          if-no-files-found: error
