name: Link check

# External links rot on their own schedule, so this runs on a clock rather than on
# every push. It also runs when the files that hold the links change, and on demand.
on:
  schedule:
    - cron: "17 13 * * *" # 13:17 UTC = 06:17 in Eugene (PDT)
  push:
    paths:
      - "src/data/**"
      - "src/lib/**"
      - "scripts/check-links.mjs"
      - ".github/workflows/link-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Every external link answers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      # The probe uses Node's built-in fetch, so no install step is needed.
      - name: Probe shipped external links
        run: node scripts/check-links.mjs --verbose
