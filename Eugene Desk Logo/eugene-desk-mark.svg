<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Eugene Desk">
  <title>Eugene Desk mark</title>
  <defs>
    <linearGradient id="deskShade" x1="8" y1="44" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1ebe3"/>
      <stop offset="1" stop-color="#e4d9cc"/>
    </linearGradient>
  </defs>
  <!-- Navy tile -->
  <rect width="64" height="64" rx="14" fill="#12253c"/>
  <!-- Soft sky band -->
  <path d="M8 28c6-8 14-12 24-12s18 4 24 12v6H8z" fill="#1a3352" opacity=".55"/>
  <!-- Valley peaks (Eugene) -->
  <path d="M8 40.5c5.5-7 11.2-11.2 17.2-11.2 4.2 0 7.6 2.4 10.8 5.8 3.4-4.6 7.8-7.6 13.5-7.6 4.8 0 8.7 2.6 14.5 9.5V48H8z" fill="#f1ebe3"/>
  <!-- Desk plane -->
  <path d="M10 46.5h44c1.4 0 2.5 1.1 2.5 2.5v3c0 1.7-1.3 3-3 3H10.5c-1.7 0-3-1.3-3-3v-3c0-1.4 1.1-2.5 2.5-2.5z" fill="url(#deskShade)"/>
  <rect x="8.5" y="46" width="47" height="2.2" rx="1.1" fill="#fffdf9"/>
  <!-- Electric blue lamp / accent (reads at small sizes) -->
  <rect x="46.2" y="22" width="3.2" height="24.5" rx="1.6" fill="#2f6bff"/>
  <circle cx="47.8" cy="20.2" r="4.2" fill="#2f6bff"/>
  <circle cx="47.8" cy="20.2" r="2" fill="#f1ebe3"/>
  <!-- Tiny book on desk -->
  <path d="M18 42.2h12.5c.7 0 1.2.5 1.2 1.2V46H16.8v-2.6c0-.7.5-1.2 1.2-1.2z" fill="#2f6bff" opacity=".92"/>
  <path d="M24.2 42.2v3.8" stroke="#f1ebe3" stroke-width="1.2" stroke-linecap="round"/>
</svg>
